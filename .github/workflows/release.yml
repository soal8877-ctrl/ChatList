name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build exe and installer
        run: python build.py

      - name: Prepare release artifacts
        shell: pwsh
        run: |
          $version = python -c "import version; print(version.__version__)"
          $installer = "dist/ChatList-$version-setup.exe"
          Copy-Item $installer "dist/ChatList-setup.exe" -Force
          Get-FileHash "dist/ChatList.exe", $installer, "dist/ChatList-setup.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Set-Content "dist/SHA256SUMS.txt" -Encoding utf8

      - name: Read release notes
        id: notes
        shell: pwsh
        run: |
          $version = python -c "import version; print(version.__version__)"
          $notesFile = ".github/release-notes/v$version.md"
          if (-not (Test-Path $notesFile)) {
            $notesFile = ".github/release-notes/TEMPLATE.md"
            (Get-Content $notesFile -Raw) -replace '\{\{VERSION\}\}', $version | Set-Content $notesFile.tmp -Encoding utf8
            $notesFile = "$notesFile.tmp"
          }
          "path=$notesFile" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ChatList ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            dist/ChatList-setup.exe
            dist/ChatList-*-setup.exe
            dist/ChatList.exe
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
